# =============================================================================
# ST7305 RLCD Example Configuration
# Waveshare ESP32-S3-RLCD-4.2 (400x300 Reflective LCD)
# =============================================================================
#
# This example demonstrates the ST7305 RLCD driver for ESPHome.
# The reflective LCD requires no backlight and is highly visible in daylight.
#
# It also shows a deep sleep cycle where the panel stays powered: the reset
# pin is held high through deep sleep, so on a deep sleep wake the panel keeps
# its configuration and the reset + init sequence is skipped. Any other reset
# (power on, reset button, watchdog, crash) re-initialises the panel.
#
# Hardware:
#   - Board: Waveshare ESP32-S3-RLCD-4.2
#   - Display: 400x300 1-bit reflective LCD
#   - Controller: ST7305
#
# =============================================================================

esphome:
  name: rlcd-display
  friendly_name: "RLCD Display"
  on_boot:
    # Below the display's setup priority (600) so its buffer is allocated
    priority: 400
    then:
      - lambda: |-
          // Only reset + init the panel when the MCU did not wake from deep
          // sleep. Must be decided before the display's first update().
          id(my_display).set_reset_on_boot(esp_reset_reason() != ESP_RST_DEEPSLEEP);
      - component.update: my_display

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Enable PSRAM for lookup tables (~360KB)
psram:
  mode: octal
  speed: 80MHz

# Logging
logger:
  level: DEBUG

# Stay awake briefly after each boot, then deep sleep
deep_sleep:
  id: deep_sleep_control
  run_duration: 10s
  sleep_duration: 5min

# SPI bus configuration
spi:
  clk_pin: GPIO11
  mosi_pin: GPIO12

# External component
external_components:
  - source: github://kylehase/ESPHome-ST7305-RLCD
    components: [st7305_rlcd]
    refresh: 0s

# =============================================================================
# Font Configuration
# =============================================================================
font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 40
  - file: "gfonts://Roboto"
    id: roboto_small
    size: 20

# =============================================================================
# Display Configuration
# =============================================================================
display:
  - platform: st7305_rlcd
    model: WAVESHARE_400X300
    rotation: 0
    id: my_display
    cs_pin: GPIO40
    dc_pin: GPIO5
    reset_pin: GPIO41
    # Default true; overridden at boot by the on_boot lambda above. Call
    # id(my_display).reset_and_init() to force a panel reset + init at any time.
    reset_on_boot: true
    update_interval: never

    lambda: |-
      // Get dimensions
      int w = it.get_width();
      int h = it.get_height();

      // Print "Hello World!" in the center of the screen
      // Arguments: x, y, font_id, color, alignment, text
      it.printf(w / 2, h / 2, id(roboto), COLOR_ON, TextAlign::CENTER, "Hello World!");
      it.printf(w / 2, h / 2 + 40, id(roboto_small), COLOR_ON, TextAlign::CENTER,
                esp_reset_reason() == ESP_RST_DEEPSLEEP ? "Woke from deep sleep" : "Panel reset + init");
      id(my_display).low_power_mode();
